name: Sync WNBA Parquet Data to S3

on:
  workflow_dispatch:
    inputs:
      sync_max_files:
        description: Optional cap for quick test runs
        required: false
        type: string
  schedule:
    - cron: "0 10 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      STORAGE_BACKEND: s3
      GITHUB_OWNER: sportsdataverse
      GITHUB_REPO: wehoop-wnba-data
      GITHUB_BRANCH: main
      GITHUB_BASE_PATHS: wnba/team_box/parquet,wnba/player_box/parquet,wnba/schedules/parquet,wnba/player_season_stats/parquet,wnba/pbp/parquet
      BLOB_STRIP_PREFIX: wnba/
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_S3_KEY_PREFIX: ${{ vars.AWS_S3_KEY_PREFIX }}
      SYNC_MAX_FILES: ${{ github.event.inputs.sync_max_files || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Print configuration
        run: |
          echo "GITHUB_REF=${{ github.ref }}"
          echo "GITHUB_SHA=${{ github.sha }}"
          echo "STORAGE_BACKEND=$STORAGE_BACKEND"
          echo "GITHUB_OWNER=$GITHUB_OWNER"
          echo "GITHUB_REPO=$GITHUB_REPO"
          echo "GITHUB_BRANCH=$GITHUB_BRANCH"
          echo "GITHUB_BASE_PATHS=$GITHUB_BASE_PATHS"
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_S3_BUCKET=$AWS_S3_BUCKET"
          echo "AWS_S3_KEY_PREFIX=$AWS_S3_KEY_PREFIX"
          echo "SYNC_MAX_FILES=$SYNC_MAX_FILES"

      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python src/sync.py 2>&1 | tee sync-output.log

      - name: Publish run summary
        if: always()
        run: |
          SUMMARY_LINE=""
          SUMMARY_JSON=""
          if [ -f sync-output.log ]; then
            SUMMARY_LINE=$(grep -E "sync_summary " sync-output.log | tail -n 1 || true)
            if [ -n "$SUMMARY_LINE" ]; then
              SUMMARY_JSON="${SUMMARY_LINE#*sync_summary }"
            fi
          fi

          {
            echo "## WNBA S3 Sync - Run Summary"
            echo
            echo "### Run context"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Workflow | $GITHUB_WORKFLOW |"
            echo "| Run number | $GITHUB_RUN_NUMBER |"
            echo "| Trigger | $GITHUB_EVENT_NAME |"
            echo "| Branch/Ref | $GITHUB_REF |"
            echo "| Commit | $GITHUB_SHA |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$SUMMARY_JSON" ]; then
            SUMMARY_JSON="$SUMMARY_JSON" python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
import json
import os

summary = json.loads(os.environ["SUMMARY_JSON"])
rows = [
    ("Total files scanned", summary.get("total_files_scanned", "n/a")),
    ("New files uploaded", summary.get("new_files_uploaded", "n/a")),
    ("Updated files uploaded", summary.get("updated_files_uploaded", "n/a")),
    ("Files skipped", summary.get("files_skipped", "n/a")),
    ("Files errored", summary.get("files_errored", "n/a")),
    ("Execution time (seconds)", summary.get("execution_time_seconds", "n/a")),
]

print("### Sync metrics")
print("| Metric | Value |")
print("|---|---|")
for label, value in rows:
    print(f"| {label} | {value} |")
print()
PY
          else
            {
              echo "### Sync metrics"
              echo "Summary JSON not found in sync output."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "<details>"
            echo "<summary>Full sync stage output</summary>"
            echo
            echo "\`\`\`text"
            if [ -f sync-output.log ]; then
              cat sync-output.log
            else
              echo "sync-output.log not found"
            fi
            echo "\`\`\`"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
