name: Sync WNBA Parquet Data to S3

on:
  workflow_dispatch:
    inputs:
      sync_max_files:
        description: Optional cap for quick test runs
        required: false
        type: string
  schedule:
    - cron: "0 10 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      STORAGE_BACKEND: s3
      GITHUB_OWNER: sportsdataverse
      GITHUB_REPO: wehoop-wnba-data
      GITHUB_BRANCH: main
      GITHUB_BASE_PATHS: wnba/team_box/parquet,wnba/player_box/parquet,wnba/schedules/parquet,wnba/player_season_stats/parquet,wnba/pbp/parquet
      BLOB_STRIP_PREFIX: wnba/
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_S3_KEY_PREFIX: ${{ vars.AWS_S3_KEY_PREFIX }}
      SYNC_MAX_FILES: ${{ github.event.inputs.sync_max_files || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Print configuration
        run: |
          echo "GITHUB_REF=${{ github.ref }}"
          echo "GITHUB_SHA=${{ github.sha }}"
          echo "STORAGE_BACKEND=$STORAGE_BACKEND"
          echo "GITHUB_OWNER=$GITHUB_OWNER"
          echo "GITHUB_REPO=$GITHUB_REPO"
          echo "GITHUB_BRANCH=$GITHUB_BRANCH"
          echo "GITHUB_BASE_PATHS=$GITHUB_BASE_PATHS"
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_S3_BUCKET=$AWS_S3_BUCKET"
          echo "AWS_S3_KEY_PREFIX=$AWS_S3_KEY_PREFIX"
          echo "SYNC_MAX_FILES=$SYNC_MAX_FILES"

      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python src/sync.py 2>&1 | tee sync-output.log

      - name: Publish run summary
        if: always()
        run: |
          NEW_COUNT=0
          UPDATED_COUNT=0
          SKIPPED_COUNT=0
          ERROR_COUNT=0
          SYNC_SUMMARY_LINE="sync_summary line not found"

          if [ -f sync-output.log ]; then
            NEW_COUNT=$(grep -c "file_uploaded_new" sync-output.log || true)
            UPDATED_COUNT=$(grep -c "file_uploaded_updated" sync-output.log || true)
            SKIPPED_COUNT=$(grep -c "file_skipped_unchanged" sync-output.log || true)
            ERROR_COUNT=$(grep -c "file_sync_error" sync-output.log || true)
            SYNC_SUMMARY_LINE=$(grep -E "sync_summary " sync-output.log | tail -n 1 || true)
            if [ -z "$SYNC_SUMMARY_LINE" ]; then
              SYNC_SUMMARY_LINE="sync_summary line not found"
            fi
          fi

          {
            echo "## WNBA S3 Sync - Run Summary"
            echo
            echo "### Overview"
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| New uploads | $NEW_COUNT |"
            echo "| Updated uploads | $UPDATED_COUNT |"
            echo "| Skipped unchanged | $SKIPPED_COUNT |"
            echo "| File errors | $ERROR_COUNT |"
            echo
            echo "### Final sync summary line"
            echo "\`\`\`text"
            echo "$SYNC_SUMMARY_LINE"
            echo "\`\`\`"
            echo
            echo "<details>"
            echo "<summary>Full sync stage output</summary>"
            echo
            echo "\`\`\`text"
            if [ -f sync-output.log ]; then
              cat sync-output.log
            else
              echo "sync-output.log not found"
            fi
            echo "\`\`\`"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
